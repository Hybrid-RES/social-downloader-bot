{
  "extractor": {
    "archive-mode": "memory",
    "user-agent": "+chrome",
    "ytdl": {
      "enabled": true,
      "module": "yt-dlp",
      "generic": true,
      "logging": true
    },
    "instagram": {
      "videos": "ytdl",
      "include": "posts,reels,stories"
    },
    "twitter": {
      "videos": "ytdl",
      "quoted": false,
      "replies": false
    },
    "facebook": {
      "videos": true
    }
  },
  "downloader": {
    "ytdl": {
      "module": "yt-dlp",
      "forward-cookies": true,
      "logging": true,
      "raw-options": {
        "noplaylist": true,
        "continuedl": true,
        "nopart": false,
        "overwrites": false,
        "windowsfilenames": true,
        "trim_file_name": 180,
        "concurrent_fragment_downloads": 4,
        "retries": 5,
        "fragment_retries": 5,
        "merge_output_format": "mp4"
      }
    }
  },
  "output": {
    "mode": "auto",
    "progress": true,
    "shorten": "eaw",
    "skip": true
  }
}
